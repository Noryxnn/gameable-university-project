# GitLab CI/CD Pipeline Configuration for MERN Stack Application
# This pipeline runs automated tests, linting, and builds for both backend and frontend

# Global variables
variables:
  NODE_VERSION: "20"
  BACKEND_DIR: "backend"
  FRONTEND_DIR: "frontend"
  # Cache configuration
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# Cache configuration for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/
    - frontend/node_modules/
    - .npm/

# Define pipeline stages
stages:
  - install
  - lint
  - test
  - build

# ============================================
# INSTALL STAGE - Install Dependencies
# ============================================

install_backend:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - cd ${BACKEND_DIR}
    - echo "📦 Installing backend dependencies..."
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - ${BACKEND_DIR}/node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - changes:
        - ${BACKEND_DIR}/**/*
        - ${BACKEND_DIR}/package.json
        - ${BACKEND_DIR}/package-lock.json
        - .gitlab-ci.yml

install_frontend:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - cd ${FRONTEND_DIR}
    - echo "📦 Installing frontend dependencies..."
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - ${FRONTEND_DIR}/node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - changes:
        - ${FRONTEND_DIR}/**/*
        - ${FRONTEND_DIR}/package.json
        - ${FRONTEND_DIR}/package-lock.json
        - .gitlab-ci.yml

# ============================================
# LINT STAGE - Code Quality Checks
# ============================================

lint_frontend:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - install_frontend
  script:
    - cd ${FRONTEND_DIR}
    - echo "🔍 Running ESLint on frontend..."
    - npm run lint
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - changes:
        - ${FRONTEND_DIR}/**/*
        - ${FRONTEND_DIR}/package.json
        - ${FRONTEND_DIR}/eslint.config.js
        - .gitlab-ci.yml

# ============================================
# TEST STAGE - Run Automated Tests
# ============================================

test_backend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - mongo:7.0
  variables:
    MONGO_URI: "mongodb://mongo:27017/test_db"
    NODE_ENV: "test"
    JWT_SECRET: "test-jwt-secret-for-ci"
    SESSION_SECRET: "test-session-secret-for-ci"
    FRONTEND_URL: "http://localhost:5173"
    BACKEND_URL: "http://localhost:5050"
    GOOGLE_CLIENT_ID: "test-client-id"
    GOOGLE_CLIENT_SECRET: "test-client-secret"
  dependencies:
    - install_backend
  before_script:
    - cd ${BACKEND_DIR}
    - echo "Setting up backend test environment..."
    - echo "MongoDB URI:" $MONGO_URI
  script:
    - echo "🧪 Running backend tests..."
    - npm run test:run -- --reporter=verbose --coverage
  after_script:
    - echo "📊 Test coverage summary:"
    - cd ${BACKEND_DIR}
    - if [ -f "coverage/coverage-summary.json" ]; then cat coverage/coverage-summary.json; fi
  artifacts:
    when: always
    paths:
      - ${BACKEND_DIR}/coverage/
    reports:
      junit: ${BACKEND_DIR}/coverage/junit.xml
    expire_in: 1 week
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - changes:
        - ${BACKEND_DIR}/**/*
        - ${BACKEND_DIR}/package.json
        - ${BACKEND_DIR}/vitest.config.js
        - .gitlab-ci.yml

test_frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - install_frontend
  variables:
    NODE_ENV: "test"
    # Frontend test environment variables
    VITE_API_URL: ${VITE_API_URL:-"http://localhost:5050"}
  before_script:
    - cd ${FRONTEND_DIR}
    - echo "🧪 Setting up frontend test environment..."
  script:
    - echo "🧪 Running frontend tests..."
    - npm run test:run -- --reporter=verbose --coverage
  after_script:
    - echo "📊 Test coverage summary:"
    - cd ${FRONTEND_DIR}
    - if [ -f "coverage/coverage-summary.json" ]; then cat coverage/coverage-summary.json; fi
  artifacts:
    when: always
    paths:
      - ${FRONTEND_DIR}/coverage/
    reports:
      junit: ${FRONTEND_DIR}/coverage/junit.xml
    expire_in: 1 week
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - changes:
        - ${FRONTEND_DIR}/**/*
        - ${FRONTEND_DIR}/package.json
        - ${FRONTEND_DIR}/vite.config.js
        - .gitlab-ci.yml

# ============================================
# BUILD STAGE - Build Application
# ============================================

build_frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - install_frontend
  variables:
    NODE_ENV: "production"
  before_script:
    - cd ${FRONTEND_DIR}
    - echo "🏗️  Setting up frontend build environment..."
  script:
    - echo "🏗️  Building frontend application..."
    - npm run build
    - echo "✅ Build completed successfully!"
    - ls -la dist/
  artifacts:
    paths:
      - ${FRONTEND_DIR}/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - changes:
        - ${FRONTEND_DIR}/**/*
        - ${FRONTEND_DIR}/package.json
        - ${FRONTEND_DIR}/vite.config.js
        - .gitlab-ci.yml

# ============================================
# OPTIONAL: Manual Test Job (for debugging)
# ============================================

test_backend_manual:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - mongo:7.0
  variables:
    MONGO_URI: "mongodb://mongo:27017/test_db"
    NODE_ENV: "test"
    JWT_SECRET: "test-jwt-secret-for-ci"
    SESSION_SECRET: "test-session-secret-for-ci"
    FRONTEND_URL: "http://localhost:5173"
    BACKEND_URL: "http://localhost:5050"
  dependencies:
    - install_backend
  script:
    - cd ${BACKEND_DIR}
    - echo "🧪 Running backend tests in watch mode (manual trigger)..."
    - npm test
  when: manual
  allow_failure: true
  only:
    - main
    - develop

